[package]
name = "dwg-mcp"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "MCP server for DWG, DXF and SVG ingestion with PNG previews, vector SVG, native text and metadata"
license = "MPL-2.0"
repository = "https://github.com/aileron-tech/dwg-mcp"

[lib]
name = "dwg_mcp"
path = "src/lib.rs"

[[bin]]
name = "dwg-mcp"
path = "src/main.rs"

[dependencies]
# The renderer. Pinned to a commit: the two crates are released together.
dwg2png = { git = "https://github.com/aileron-tech/dwg2png", rev = "6d3785f7a7d7376f2640f4b502cab4a54ed27350" }
ab_glyph = "0.2"
base64 = "0.22"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ureq = "3"

[dev-dependencies]
# Writes the synthetic DWG fixtures; the same pinned version the renderer reads with.
acadrust = { version = "=0.4.0", features = ["serde"] }
rmcp = { version = "3.11", features = ["client", "transport-child-process"] }
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
