name: release

# Build downloadable binaries and attach them to a GitHub Release when a
# version tag (v*) is pushed. The package manager manifests point at these files.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build dwg-mcp
        run: cargo build --release --locked --bin dwg-mcp --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          tar -C "$dir" -czf "dwg-mcp-${{ matrix.target }}.tar.gz" dwg-mcp
          shasum -a 256 "dwg-mcp-${{ matrix.target }}.tar.gz" > "dwg-mcp-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          7z a "dwg-mcp-${{ matrix.target }}.zip" "./$dir/dwg-mcp.exe"
          sha256sum "dwg-mcp-${{ matrix.target }}.zip" > "dwg-mcp-${{ matrix.target }}.zip.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dwg-mcp-*.tar.gz
            dwg-mcp-*.zip
            dwg-mcp-*.sha256
          generate_release_notes: true
