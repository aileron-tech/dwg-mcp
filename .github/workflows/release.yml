name: release

# Build downloadable binaries and attach them to a GitHub Release when a
# version tag (v*) is pushed. scripts/install.sh, scripts/install.ps1 and the
# Homebrew formula download these files.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build dwg-mcp
        run: cargo build --release --locked --bin dwg-mcp --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="dwg-mcp-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" dwg-mcp
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          archive="dwg-mcp-${{ matrix.target }}.zip"
          out="$PWD/$archive"
          (cd "target/${{ matrix.target }}/release" && 7z a "$out" dwg-mcp.exe)
          sha256sum "$archive" > "$archive.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dwg-mcp-*.tar.gz
            dwg-mcp-*.zip
            dwg-mcp-*.sha256
          generate_release_notes: true
