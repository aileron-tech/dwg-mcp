name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install a font for the renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Lint
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked
